apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
        command: ["start.sh", "immich"]  
        ports:
        - containerPort: 3001
        volumeMounts:
        - name: photos-storage
          mountPath: "/usr/src/app/upload"
        - name: localtime
          mountPath: "/etc/localtime"
          readOnly: true
        envFrom:
        - configMapRef:
            name: immich-env
      volumes:
      - name: photos-storage
        hostPath:
          path: /nfs-data/photos
          type: DirectoryOrCreate
      - name: localtime
        hostPath:
          path: /etc/localtime