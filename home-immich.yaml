---
apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-secrets
  namespace: immich
type: Opaque
data:
  DB_PASSWORD: <your-db-password-base64>
  DB_USERNAME: <your-db-username-base64>
  DB_DATABASE_NAME: <your-db-database-name-base64>
  # If you need any additional secret data, add them here
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          ports:
            - containerPort: 2283
          envFrom:
            - secretRef:
                name: immich-db-secrets
            - configMapRef:
                name: immich-env
          volumeMounts:
            - mountPath: /usr/src/app/upload
              name: upload-volume
            - mountPath: /etc/localtime
              name: localtime
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: upload-volume
          hostPath:
            path: /mnt/immich/upload
        - name: localtime
          hostPath:
            path: /etc/localtime
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  type: LoadBalancer
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: 2283
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:release-cuda
          envFrom:
            - secretRef:
                name: immich-db-secrets
            - configMapRef:
                name: immich-env
          volumeMounts:
            - mountPath: /cache
              name: model-cache-volume
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: model-cache-volume
          hostPath:
            path: /mnt/immich/ml-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          args: [ "--save", "", "--appendonly", "no" ]
          volumeMounts:
            - mountPath: /data
              name: redis-data-volume
      volumes:
        - name: redis-data-volume
          hostPath:
            path: /mnt/immich/redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: immich
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: postgres
          image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
          envFrom:
            - secretRef:
                name: immich-db-secrets
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data-volume
          command: [
            "postgres",
            "-c", "shared_preload_libraries=vectors.so",
            "-c", "search_path=\\\"$user\\\", public, vectors",
            "-c", "logging_collector=on",
            "-c", "max_wal_size=2GB",
            "-c", "shared_buffers=512MB",
            "-c", "wal_compression=on"
          ]
      volumes:
        - name: db-data-volume
          hostPath:
            path: /mnt/immich/postgres
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: immich
spec:
  selector:
    app: database
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-env
  namespace: immich
data:
  UPLOAD_LOCATION: /mnt/immich/upload
  MODEL_CACHE_LOCATION: /mnt/immich/ml-cache
  REDIS_DATA_LOCATION: /mnt/immich/redis
  DB_DATA_LOCATION: /mnt/immich/postgres